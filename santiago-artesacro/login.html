<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Santiago Artesacro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">santiago.artesacro</div>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
                <li><a href="registro.html">Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <div class="container" style="max-width: 450px;">
        <div class="card">
            <h2>Iniciar Sesión (RF-01)</h2>
            <p style="font-size: 0.9rem; margin-bottom: 25px;">Ingrese sus credenciales de acceso registradas en el sistema.</p>
            
            <form action="index.html" method="GET">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-with-icon">
                        <span class="input-icon">✉</span>
                        <input type="email" id="email" placeholder="usuario@correo.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-with-icon">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn">Ingresar</button>
            </form>
        </div>
    </div>
<footer>
        <p>SENA - ADSO | Ficha 3336098</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
