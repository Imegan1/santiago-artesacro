<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>santiago.artesacro - Login</title>
    <!-- Integración de Framework Tailwind CSS para maquetación responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F9F9F7] min-h-screen flex items-center justify-center p-4">

    <!-- Contenedor Principal Adaptable (Mobile First) -->
    <main class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-gray-100">
        
        <!-- Encabezado de la Marca -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-serif font-bold text-[#2E5A36] tracking-wide">santiago.artesacro</h1>
            <div class="h-0.5 w-16 bg-[#2E5A36] mx-auto mt-2 opacity-50"></div>
        </header>

        <!-- Formulario de Autenticación -->
        <form class="space-y-6">
            
            <!-- Campo: Correo Electrónico -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Correo Electrónico</label>
                <input class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#2E5A36] focus:border-transparent outline-none transition text-gray-800" 
                       type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>

            <!-- Campo: Contraseña -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Contraseña</label>
                <input class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-[#2E5A36] focus:border-transparent outline-none transition text-gray-800" 
                       type="password" id="password" placeholder="••••••••" required>
            </div>

            <!-- Botón de Acción Principal (Usabilidad y Enfoque) -->
            <button class="w-full bg-[#2E5A36] hover:bg-[#234429] text-white font-semibold py-3 px-4 rounded-lg shadow transition-colors duration-200 text-center block" 
                    type="submit">
                Ingresar
            </button>
            
        </form>

    </main>

</body>
</html>
