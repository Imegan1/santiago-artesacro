<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Santiago Artesacro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">santiago.artesacro</div>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="login.html">Iniciar Sesión</a></li>
                <li><a href="registro.html">Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <div class="container" style="max-width: 550px;">
        <div class="card">
            <h2>Formulario de Registro (RF-02)</h2>
            <p style="font-size: 0.9rem; margin-bottom: 25px;">Complete los datos básicos requeridos para dar de alta un nuevo cliente[cite: 2].</p>
            
            <form action="index.html" method="GET">
                <div class="form-group">
                    <label for="nombres">Nombres</label>
                    <div class="input-with-icon">
                        <span class="input-icon">👤</span>
                        <input type="text" id="nombres" placeholder="Ingrese sus nombres" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="apellidos">Apellidos</label>
                    <div class="input-with-icon">
                        <span class="input-icon">👤</span>
                        <input type="text" id="apellidos" placeholder="Ingrese sus apellidos" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="cedula">Cédula / Documento de Identidad</label>
                    <div class="input-with-icon">
                        <span class="input-icon">🆔</span>
                        <input type="text" id="cedula" placeholder="Número de documento" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha de Nacimiento</label>
                    <div class="input-with-icon">
                        <span class="input-icon">📅</span>
                        <input type="date" id="fecha" required>
                    </div>
                </div>

                <button type="submit" class="btn">Registrarse</button>
            </form>
        </div>
    </div>
<footer>
        <p>SENA - ADSO | Ficha 3336098</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
